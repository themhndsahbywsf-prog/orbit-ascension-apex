name: Prepare project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find uploaded archive
        id: archive
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then echo 'No ZIP found in repository root'; exit 1; fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Extract project
        shell: bash
        run: |
          ZIP="${{ steps.archive.outputs.zip }}"
          mkdir -p .extract-temp
          unzip -o "$ZIP" -d .extract-temp
          rm -rf .extract-temp/.github/workflows
          rm -f .extract-temp/blind-date-show-fixed-v12.zip
          DIRS="$(find .extract-temp -mindepth 1 -maxdepth 1 -type d | wc -l)"
          FILES="$(find .extract-temp -mindepth 1 -maxdepth 1 -type f | wc -l)"
          if [ "$DIRS" = "1" ] && [ "$FILES" = "0" ]; then
            TOP="$(find .extract-temp -mindepth 1 -maxdepth 1 -type d -print -quit)"
            cp -a "$TOP"/. .
          else
            cp -a .extract-temp/. .
          fi
          rm -rf .extract-temp "$ZIP"
          rm -f .github/workflows/extract-project.yml
      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: extract project source'
          git push
